name: xiaosu
description: 小酥 - 全功能AI助手
publish_to: 'no'
version: 2.2.0+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 核心
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  equatable: ^2.0.5
  path_provider: ^2.1.1
  
  # UI
  flutter_markdown: ^0.6.18
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.0
  
  # 工具
  uuid: ^4.2.1
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
