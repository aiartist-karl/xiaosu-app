name: xiaosu
description: 小酥 - 全功能AI助手（Agent模式）
publish_to: 'no'
version: 2.3.0+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 核心
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  equatable: ^2.0.5
  path_provider: ^2.1.1
  
  # 网络
  web_socket_channel: ^2.4.0
  
  # UI
  flutter_markdown: ^0.6.18
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # 工具
  uuid: ^4.2.1
  flutter_tts: ^4.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
