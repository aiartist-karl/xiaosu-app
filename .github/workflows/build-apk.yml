name: Build APK

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --install "platforms;android-36" || true
          yes | sdkmanager --install "build-tools;36.0.0" || true
          yes | sdkmanager --install "ndk;28.2.13676358" || true
          yes | sdkmanager --install "cmake;3.31.6" || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaosu-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
