name: Build APK

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Android SDK components
        run: |
          echo "Installing Android SDK 36, build-tools, NDK 28..."
          yes | sdkmanager --install "platforms;android-36" 2>/dev/null || echo "android-36 install failed, trying alternatives..."
          yes | sdkmanager --install "build-tools;36.0.0" 2>/dev/null || yes | sdkmanager --install "build-tools;35.0.0" 2>/dev/null || true
          yes | sdkmanager --install "ndk;28.2.13676358" 2>/dev/null || echo "NDK 28 install failed"
          yes | sdkmanager --install "cmake;3.31.6" 2>/dev/null || yes | sdkmanager --install "cmake;3.22.1" 2>/dev/null || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xiaosu-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build/
            android/.gradle/
            **/build/
          retention-days: 7
