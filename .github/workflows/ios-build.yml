name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Prepare iOS build
        run: |
          # Ensure Flutter.xcframework is in place
          FLUTTER_CACHE=$(find $FLUTTER_ROOT -name "Flutter.xcframework" -type d 2>/dev/null | head -1)
          if [ -n "$FLUTTER_CACHE" ] && [ ! -d "ios/Flutter/Flutter.xcframework" ]; then
            echo "Copying Flutter.xcframework from cache..."
            cp -r "$FLUTTER_CACHE" ios/Flutter/Flutter.xcframework
          fi
          # Also check for it in the flutter SDK bin/cache
          if [ ! -d "ios/Flutter/Flutter.xcframework" ]; then
            echo "Looking for Flutter.xcframework in FLUTTER_ROOT..."
            ls -la $FLUTTER_ROOT/bin/cache/artifacts/engine/ios/ 2>/dev/null || true
            find $FLUTTER_ROOT -name "Flutter.xcframework" -type d 2>/dev/null | head -5
            # Try to create it from the engine artifacts
            ENGINE_DIR="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios"
            if [ -d "$ENGINE_DIR" ]; then
              ls -la "$ENGINE_DIR"
            fi
          fi

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign --verbose 2>&1 | tail -100

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r xiaosu-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaosu-ios-unsigned
          path: xiaosu-ios-unsigned.ipa
