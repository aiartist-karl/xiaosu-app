name: Build iOS IPA

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FLUTTER_SWIFT_PACKAGE_MANAGER: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS (no codesign, SPM disabled)
        run: |
          # Disable Swift Package Manager completely
          export FLUTTER_SWIFT_PACKAGE_MANAGER=0
          
          # Also modify Podfile if needed
          cd ios
          if [ -f Podfile ]; then
            sed -i.bak 's/\.buildFramework/# .buildFramework/' Podfile 2>/dev/null || true
          fi
          cd ..
          
          # Build with SPM disabled
          flutter build ios --release --no-codesign --no-tree-shake-icons --verbose 2>&1 | tail -100

      - name: Package IPA
        if: success()
        run: |
          mkdir -p payload
          cp -r build/ios/iphoneos/Runner.app payload/
          zip -r xiaosu-ios-unsigned.ipa payload/
          rm -rf payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xiaosu-ios-unsigned
          path: xiaosu-ios-unsigned.ipa
          retention-days: 30

      - name: Upload IPA to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.0
          files: xiaosu-ios-unsigned.ipa

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            build/
            .dart_tool/
          retention-days: 7
