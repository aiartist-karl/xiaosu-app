name: Build iOS IPA

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare iOS project
        run: |
          rm -rf ios/
          flutter create --platforms=ios --project-name=xiaosu --org=com.xiaosu .
          flutter pub get
          
          # Set dummy development team for unsigned build
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "";/' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS (unsigned)
        run: |
          # Use xcodebuild with explicit no-signing settings
          cd ios
          xcodebuild -workspace Runner.xcworkspace             -scheme Runner             -configuration Release             -sdk iphoneos             -derivedDataPath ../build/ios             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             COMPILER_INDEX_STORE_ENABLE=NO
          cd ..

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r xiaosu-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xiaosu-ios-unsigned
          path: xiaosu-ios-unsigned.ipa
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            build/
            ios/
          retention-days: 7
