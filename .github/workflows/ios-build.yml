name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate iOS project
        run: |
          # Save critical files before regenerating
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp lib/main.dart /tmp/main.dart.bak 2>/dev/null || true
          cp ios/Runner/AppDelegate.swift /tmp/AppDelegate.swift.bak 2>/dev/null || true
          cp ios/Runner/Info.plist /tmp/Info.plist.bak 2>/dev/null || true
          cp ios/Runner/Runner.entitlements /tmp/Runner.entitlements.bak 2>/dev/null || true
          cp -r assets /tmp/assets.bak 2>/dev/null || true
          
          # Remove existing iOS project
          rm -rf ios/
          
          # Regenerate iOS project from Flutter template
          flutter create --platforms=ios --project-name=xiaosu_core --org=com.xiaosu .
          
          # Restore critical files
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/main.dart.bak lib/main.dart 2>/dev/null || true
          cp /tmp/AppDelegate.swift.bak ios/Runner/AppDelegate.swift 2>/dev/null || true
          cp /tmp/Info.plist.bak ios/Runner/Info.plist 2>/dev/null || true
          cp /tmp/Runner.entitlements.bak ios/Runner/Runner.entitlements 2>/dev/null || true
          cp -r /tmp/assets.bak assets 2>/dev/null || true
          
          # Ensure Flutter.xcframework is in place
          FLUTTER_CACHE=$(find $FLUTTER_ROOT -name "Flutter.xcframework" -type d 2>/dev/null | head -1)
          if [ -n "$FLUTTER_CACHE" ] && [ ! -d "ios/Flutter/Flutter.xcframework" ]; then
            cp -r "$FLUTTER_CACHE" ios/Flutter/
          fi
          
          # Re-run pub get to regenerate plugin configs
          flutter pub get
          
          echo "=== Verify package name ==="
          head -3 pubspec.yaml

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r xiaosu-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaosu-ios-unsigned
          path: xiaosu-ios-unsigned.ipa
