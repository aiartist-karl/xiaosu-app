name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Create iOS project from scratch
        run: |
          # Remove existing iOS directory  
          rm -rf ios/
          
          # Regenerate iOS project
          flutter create --platforms=ios --project-name=xiaosu_core --org=com.xiaosu .
          
          # Restore original pubspec.yaml (flutter create changes the name)
          cp .ci/pubspec_original.yaml pubspec.yaml
          
          # Ensure Flutter.xcframework is in place
          FLUTTER_CACHE=$(find $FLUTTER_ROOT -name "Flutter.xcframework" -type d 2>/dev/null | head -1)
          if [ -n "$FLUTTER_CACHE" ] && [ ! -d "ios/Flutter/Flutter.xcframework" ]; then
            cp -r "$FLUTTER_CACHE" ios/Flutter/
          fi
          
          # Run pub get with correct package name
          flutter pub get
          
          # Verify
          echo "=== Package name ==="
          head -1 pubspec.yaml
          echo "=== iOS Flutter dir ==="
          ls ios/Flutter/

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r xiaosu-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaosu-ios-unsigned
          path: xiaosu-ios-unsigned.ipa
