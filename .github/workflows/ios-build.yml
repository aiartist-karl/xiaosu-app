name: Build iOS IPA

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare iOS project
        run: |
          rm -rf ios/
          flutter create --platforms=ios --project-name=xiaosu --org=com.xiaosu .
          flutter pub get

      - name: Configure unsigned build
        run: |
          # Patch project.pbxproj to remove code signing requirement
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          # Add CODE_SIGNING_ALLOWED=NO to all build configurations
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ" || true
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBXPROJ" || true
          # Ensure development team is empty
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ" || true

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r xiaosu-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xiaosu-ios-unsigned
          path: xiaosu-ios-unsigned.ipa
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            build/
            ios/
          retention-days: 7
