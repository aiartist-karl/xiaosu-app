name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Create iOS project from scratch
        run: |
          # Save original pubspec.yaml content
          PKG_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          echo "Package name: $PKG_NAME"
          
          # Remove existing iOS directory
          rm -rf ios/
          
          # Regenerate iOS project using the exact package name
          flutter create --platforms=ios --project-name="$PKG_NAME" --org=com.xiaosu .
          
          # Verify pubspec name wasn't changed
          CURRENT_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          echo "Current name after create: $CURRENT_NAME"
          
          # Force-set the correct name if flutter create changed it
          if [ "$CURRENT_NAME" != "$PKG_NAME" ]; then
            echo "Fixing package name from $CURRENT_NAME to $PKG_NAME"
            sed -i '' "s/^name: $CURRENT_NAME/name: $PKG_NAME/" pubspec.yaml
          fi
          
          # Ensure Flutter.xcframework is in place
          FLUTTER_CACHE=$(find $FLUTTER_ROOT -name "Flutter.xcframework" -type d 2>/dev/null | head -1)
          if [ -n "$FLUTTER_CACHE" ] && [ ! -d "ios/Flutter/Flutter.xcframework" ]; then
            cp -r "$FLUTTER_CACHE" ios/Flutter/
          fi
          
          # Restore custom Info.plist if needed
          if [ -f "ios/Runner/Info.plist" ]; then
            echo "Info.plist exists"
          fi
          
          # Run pub get to set up all dependencies
          flutter pub get
          
          # Verify
          echo "=== Final package name ==="
          head -3 pubspec.yaml
          echo "=== iOS directory ==="
          ls ios/
          echo "=== Flutter dir ==="
          ls ios/Flutter/

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r xiaosu-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaosu-ios-unsigned
          path: xiaosu-ios-unsigned.ipa
